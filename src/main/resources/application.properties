# CivLint runtime configuration.

spring.application.name=civlint

# Virtual threads for request handling; agent orchestration creates its own per-task threads.
spring.threads.virtual.enabled=true

# Deterministic local execution. In-memory H2, created fresh per start and migrated by Flyway.
spring.datasource.url=jdbc:h2:mem:civlint;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=civlint
spring.datasource.password=

# Flyway owns the schema. Hibernate must never alter it, so that the schema in the artifact is the
# schema in use and a migration is the only way it changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# The H2 console is a database shell reachable over HTTP. Spring Boot 4 ships no console
# autoconfiguration on this classpath, so it cannot start; this stays as defence in depth in case a
# later dependency brings that autoconfiguration back. CivLintApiIT asserts /h2-console is closed.
spring.h2.console.enabled=false

# Only health is exposed. Nothing that reveals configuration, environment or beans.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Errors are returned as RFC 9457 problem details without echoing untrusted input back. Spring Boot 4
# relocated these three keys from server.error.* to spring.web.error.*; the old names no longer bind.
spring.mvc.problemdetails.enabled=true
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# Fixed formatting so rendered output does not vary by host locale.
spring.web.locale=en
spring.web.locale-resolver=fixed
